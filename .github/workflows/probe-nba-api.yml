name: Probe NBA data sources from a GitHub runner

# Manually triggered connectivity check. It answers: do stats.nba.com, the nba.com
# live/CDN endpoints, and kaggle.com serve requests from a GitHub Actions runner?
# It makes a handful of read-only HTTP calls and prints one "PROBE <name>: ..." line
# per call. It writes nothing and uses no credentials.
#
# Steps:
#   1. stats.nba.com via nba_api (LeagueGameFinder for yesterday, PlayerGameLog)
#   2. live endpoints: nba_api live ScoreBoard, the cdn.nba.com liveData boxscore JSON
#      fetched directly, and nba_api live BoxScore for a 2025-26 game
#   3. kaggle.com dataset API without credentials (status only; 401/403 is fine)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nba_api
        run: python -m pip install --quiet "nba_api==1.4.1" pandas requests

      - name: Probe two endpoints
        run: |
          python - <<'EOF'
          import time
          from datetime import date, timedelta

          from nba_api.stats.endpoints import leaguegamefinder, playergamelog

          TIMEOUT = 10  # seconds per request
          HEADERS = {
              "User-Agent": "nba-ai-ml-probe/1.0 (personal portfolio project; +https://github.com/cbratkovics/nba-ai-ml)",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.nba.com/",
              "Origin": "https://www.nba.com",
          }
          PLAYER_ID = "203999"  # Nikola Jokic
          SEASON = "2024-25"

          def status_of(endpoint):
              resp = getattr(endpoint, "nba_response", None)
              if resp is None:
                  return None
              for attr in ("_status_code", "status_code"):
                  if hasattr(resp, attr):
                      return getattr(resp, attr)
              return None

          def run(label, make):
              start = time.perf_counter()
              try:
                  endpoint = make()
                  elapsed = time.perf_counter() - start
                  frames = endpoint.get_data_frames()
                  rows = sum(len(f) for f in frames)
                  print(f"PROBE {label}: http_status={status_of(endpoint)} rows={rows} frames={len(frames)} elapsed={elapsed:.2f}s")
              except Exception as exc:
                  elapsed = time.perf_counter() - start
                  print(f"PROBE {label}: FAILED {type(exc).__name__}: {exc} elapsed={elapsed:.2f}s")

          yesterday = (date.today() - timedelta(days=1)).strftime("%m/%d/%Y")
          print(f"probe date (yesterday): {yesterday}")

          run(
              "leaguegamefinder",
              lambda: leaguegamefinder.LeagueGameFinder(
                  date_from_nullable=yesterday,
                  date_to_nullable=yesterday,
                  league_id_nullable="00",
                  headers=HEADERS,
                  timeout=TIMEOUT,
              ),
          )
          run(
              "playergamelog",
              lambda: playergamelog.PlayerGameLog(
                  player_id=PLAYER_ID,
                  season=SEASON,
                  headers=HEADERS,
                  timeout=TIMEOUT,
              ),
          )
          EOF

      - name: Probe live endpoints (scoreboard, cdn boxscore, live boxscore)
        run: |
          python - <<'EOF'
          import time

          import requests
          from nba_api.live.nba.endpoints import boxscore, scoreboard

          TIMEOUT = 10  # seconds per request
          HEADERS = {
              "User-Agent": "nba-ai-ml-probe/1.0 (personal portfolio project; +https://github.com/cbratkovics/nba-ai-ml)",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.nba.com/",
              "Origin": "https://www.nba.com",
          }
          GAME_ID = "0022500001"  # first regular-season game id of 2025-26
          CDN_URL = f"https://cdn.nba.com/static/json/liveData/boxscore/boxscore_{GAME_ID}.json"

          def status_of(endpoint):
              resp = getattr(endpoint, "nba_response", None)
              if resp is None:
                  return None
              for attr in ("_status_code", "status_code"):
                  if hasattr(resp, attr):
                      return getattr(resp, attr)
              return None

          # A1. nba_api live ScoreBoard (today's games)
          start = time.perf_counter()
          try:
              sb = scoreboard.ScoreBoard(headers=HEADERS, timeout=TIMEOUT)
              games = sb.get_dict().get("scoreboard", {}).get("games", [])
              first = games[0].get("gameId") if games else None
              print(f"PROBE scoreboard: http_status={status_of(sb)} games={len(games)} first_game_id={first} elapsed={time.perf_counter() - start:.2f}s")
          except Exception as exc:
              print(f"PROBE scoreboard: FAILED {type(exc).__name__}: {exc} elapsed={time.perf_counter() - start:.2f}s")

          # A2. cdn.nba.com liveData boxscore, fetched directly
          start = time.perf_counter()
          try:
              r = requests.get(CDN_URL, headers=HEADERS, timeout=TIMEOUT)
              has_game = False
              players = None
              if r.headers.get("content-type", "").startswith("application/json"):
                  body = r.json()
                  has_game = "game" in body
                  if has_game:
                      g = body["game"]
                      players = len(g.get("homeTeam", {}).get("players", [])) + len(g.get("awayTeam", {}).get("players", []))
              print(f"PROBE cdn_boxscore: http_status={r.status_code} bytes={len(r.content)} has_game_key={has_game} players={players} elapsed={time.perf_counter() - start:.2f}s")
          except Exception as exc:
              print(f"PROBE cdn_boxscore: FAILED {type(exc).__name__}: {exc} elapsed={time.perf_counter() - start:.2f}s")

          # A3. nba_api live BoxScore for the same game
          start = time.perf_counter()
          try:
              bs = boxscore.BoxScore(game_id=GAME_ID, headers=HEADERS, timeout=TIMEOUT)
              g = bs.get_dict().get("game", {})
              players = len(g.get("homeTeam", {}).get("players", [])) + len(g.get("awayTeam", {}).get("players", []))
              print(f"PROBE live_boxscore: http_status={status_of(bs)} game_id={g.get('gameId')} players={players} elapsed={time.perf_counter() - start:.2f}s")
          except Exception as exc:
              print(f"PROBE live_boxscore: FAILED {type(exc).__name__}: {exc} elapsed={time.perf_counter() - start:.2f}s")
          EOF

      - name: Probe kaggle.com reachability (no credentials)
        run: |
          python - <<'EOF'
          import time

          import requests

          TIMEOUT = 10
          URL = "https://www.kaggle.com/api/v1/datasets/view/eoinamoore/historical-nba-data-and-player-box-scores"
          HEADERS = {"User-Agent": "nba-ai-ml-probe/1.0 (personal portfolio project; +https://github.com/cbratkovics/nba-ai-ml)"}

          start = time.perf_counter()
          try:
              r = requests.get(URL, headers=HEADERS, timeout=TIMEOUT)
              print(f"PROBE kaggle: http_status={r.status_code} elapsed={time.perf_counter() - start:.2f}s (401/403 expected without credentials; any status means the host is reachable)")
          except Exception as exc:
              print(f"PROBE kaggle: FAILED {type(exc).__name__}: {exc} elapsed={time.perf_counter() - start:.2f}s")
          EOF
