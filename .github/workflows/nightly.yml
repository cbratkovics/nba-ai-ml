name: Nightly ingest, residuals, slate

# Every day at 10:00 UTC (and on demand with an optional date for replay):
#   1. daily ingest from the Kaggle dump (new/changed rows pushed to the HF dataset repo)
#   2. residuals for yesterday's predictions
#   2b. analyst brief for yesterday (Groq; never fails the job)
#   3. slate for today's games
#   3c. drift check against the day-aligned reference; HOLD / streak WARN open a labelled issue, never block
#   4. push tonight's predictions/, decisions/, drift/, residuals/, daily_reports/, brief/ files to the HF dataset repo
#   5. upload data/daily_report.json and data/nightly_summary.json as an artifact
#   6. warehouse (fixed decision 7): when the run ingested, scored or slated anything, load
#      the Hugging Face files and build the incremental silver models with their parents and
#      children (bronze copies, snapshot, gold, tests) on MotherDuck (`nba`, MOTHERDUCK_TOKEN);
#      without the token, or with DBT_TARGET=local, build into a local DuckDB file and upload
#      it as a workflow artifact. Then export the gold marts and push them to gold/ in the
#      dataset repo. Off-season zero-row runs skip the build and exit 0. A weekly full refresh
#      is warehouse.yml.
#
# Days with no schedule file (season not published yet) or no games print one explicit
# line each and exit 0. Schema validation errors and download failures fail the job.
#
# Dispatch with `rehearsal: true` to run steps 3 to 6 on a synthetic game night without
# pushing anything (nba/rehearsal.py, ADR-0028): the slate, decisions and drift report are
# written locally, the warehouse builds into a local DuckDB file that is uploaded as an
# artifact, and the publish step only lists what it would push.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date (YYYY-MM-DD); default today UTC. Residuals use the day before."
        required: false
        default: ""
      rehearsal:
        description: "Rehearse a game night (nba.rehearsal, ADR-0028): synthetic schedule, no pushes, local warehouse target, publish dry-run"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # HOLD / WARN issues (nba/drift/notify.py); labels are created idempotently

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # optional: without it the brief is agent_unavailable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Require secrets
        run: |
          missing=""
          for v in HF_TOKEN KAGGLE_USERNAME KAGGLE_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Install project with the warehouse extra
        run: python -m pip install --quiet -c constraints.txt ".[warehouse]"

      - name: Run nightly pipeline
        if: ${{ !inputs.rehearsal }}
        run: |
          set -o pipefail
          if [ -n "${{ inputs.date }}" ]; then
            python -m nba.nightly --date "${{ inputs.date }}" --push 2>&1 | tee nightly.log
          else
            python -m nba.nightly --push 2>&1 | tee nightly.log
          fi

      - name: Rehearse a game night (no pushes, no agent; ADR-0028)
        if: ${{ inputs.rehearsal }}
        env:
          NBA_REHEARSAL: "1"  # nba.storage.hf refuses every write while this is set
          GROQ_API_KEY: ""
        run: |
          set -o pipefail
          if [ -n "${{ inputs.date }}" ]; then
            python -m nba.rehearsal --date "${{ inputs.date }}" 2>&1 | tee nightly.log
          else
            python -m nba.rehearsal 2>&1 | tee nightly.log
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Nightly outcome"
            grep -E "^(NIGHTLY|INGEST|RESIDUALS|AGENT|SLATE|DECISIONS|DRIFT) " nightly.log || echo "(no outcome lines; the run failed before logging)"
            if grep -q "no schedule file for season" nightly.log; then
              echo; echo "Outcome: NO SCHEDULE for this date's season (the dump author has not published it yet)."
            elif grep -q "no games on this date" nightly.log; then
              echo; echo "Outcome: NO GAMES today."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue on HOLD or on a no-schedule streak (idempotent)
        if: ${{ !inputs.rehearsal }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -m nba.drift.notify --summary data/nightly_summary.json --body-out issue_body.md | while read -r _ label title; do
            gh label create "$label" --force --description "opened by the nightly drift policy" || true
            existing="$(gh issue list --label "$label" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
            if [ -z "$existing" ]; then
              gh issue create --label "$label" --title "$title" --body-file issue_body.md
            else
              echo "issue #$existing already open for: $title"
            fi
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: |
            data/daily_report.json
            data/nightly_summary.json
            nightly.log
          if-no-files-found: warn

      - name: Decide whether the warehouse has anything to build
        id: gate
        run: |
          line="$(python -m nba.warehouse.gate --summary data/nightly_summary.json)"
          echo "$line"
          echo "verdict=$(echo "$line" | awk '{print $2}' | tr -d ':')" >> "$GITHUB_OUTPUT"

      - name: Choose the warehouse target
        id: target
        if: steps.gate.outputs.verdict == 'build'
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          # A rehearsal builds a scratch local DuckDB file, never the MotherDuck warehouse.
          DBT_TARGET: ${{ inputs.rehearsal && 'local' || '' }}
        run: |
          if [ -n "$MOTHERDUCK_TOKEN" ] && [ "${DBT_TARGET:-}" != "local" ]; then
            echo "target=motherduck" >> "$GITHUB_OUTPUT"; echo "building on MotherDuck (nba)"
          else
            echo "target=local" >> "$GITHUB_OUTPUT"; echo "no MOTHERDUCK_TOKEN (or DBT_TARGET=local): building a local DuckDB file"
          fi

      - name: Load the warehouse sources and build the incremental models
        if: steps.gate.outputs.verdict == 'build'
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          DBT_TARGET: ${{ steps.target.outputs.target }}
          NBA_DUCKDB_PATH: .duckdb/nba.duckdb
        run: |
          mkdir -p .duckdb
          python -m nba.warehouse.load --root data/warehouse
          if [ "${{ inputs.rehearsal }}" = "true" ]; then
            # Rehearsal: a first pass creates the scratch warehouse from the published files
            # (seeds included, since no full refresh preceded it), then tonight's local products
            # are staged where pull_products would have put them, so the second pass below is
            # a genuine incremental run over new nightly rows (ADR-0028).
            dbt build --project-dir dbt --profiles-dir dbt --full-refresh 2>&1 | tee dbt-rehearsal-first-pass.log
            python -m nba.rehearsal stage-products --root . --warehouse data/warehouse
          fi
          # The `nightly` selector (dbt/selectors.yml, shared with `make dbt-nightly`): every
          # model, seed and the snapshot with their tests (ADR-0023); the incremental silver
          # models run incrementally.
          dbt build --project-dir dbt --profiles-dir dbt --selector nightly 2>&1 | tee dbt.log
          dbt run-operation export_gold --project-dir dbt --profiles-dir dbt

      - name: Push the exported gold marts to the dataset repo
        if: steps.gate.outputs.verdict == 'build' && !inputs.rehearsal
        run: python -m nba.warehouse.publish --export-dir data/warehouse/export

      - name: Rehearsal only - list what the publish step would have pushed
        if: steps.gate.outputs.verdict == 'build' && inputs.rehearsal
        env:
          NBA_REHEARSAL: "1"
        run: python -m nba.warehouse.publish --export-dir data/warehouse/export --dry-run

      - name: Upload the local warehouse file (fallback target or rehearsal)
        if: steps.gate.outputs.verdict == 'build' && steps.target.outputs.target == 'local'
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-local-${{ github.run_id }}
          path: |
            .duckdb/nba.duckdb
            data/warehouse/export/
            dbt.log
            dbt-rehearsal-first-pass.log
          if-no-files-found: warn
