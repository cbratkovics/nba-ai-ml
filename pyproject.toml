[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-stat-predictor"
version = "2.0.0"
description = "Batch NBA player-stat prediction pipeline (points, rebounds, assists)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "huggingface_hub==1.31.0",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "groq==1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.5",
]
# The warehouse toolchain alone (nightly job, CI dbt job); the same pins as constraints.txt.
warehouse = [
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.5",
]

[tool.setuptools.packages.find]
include = ["nba*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend", "scratch", ".venv", "dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
